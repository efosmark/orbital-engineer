[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-engineer"
version = "0.1.0"
description = "GPU-accelerated N-body simulation with a GTK 4 client"
readme = "README.md"
# SharedMemory(track=False) requires Python 3.13 or newer.
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
gtk = [
  "PyGObject>=3.52.3",
  "pycairo>=1.28.0",
  "matplotlib>=3.10",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pygobject-stubs>=2.13.0",
]

[project.gui-scripts]
orbital-engineer = "app:run"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["orbitalengineer*", "gui*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
orbitalengineer = ["engine/**/*.cl"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["src/orbitalengineer"]
pythonpath = ["src"]
