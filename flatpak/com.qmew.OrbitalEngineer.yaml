app-id: com.qmew.OrbitalEngineer
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: orbital-engineer
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  # The UI and separately launched server communicate over TCP.
  - --share=network
  - --device=dri

modules:
  - python3-deps/python3-deps.json
  - name: orbital-engineer
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app dist/*.whl
      - install -Dm644 data/com.qmew.OrbitalEngineer.desktop /app/share/applications/com.qmew.OrbitalEngineer.desktop
      - install -Dm644 data/com.qmew.OrbitalEngineer.metainfo.xml /app/share/metainfo/com.qmew.OrbitalEngineer.metainfo.xml
      - install -Dm644 data/com.qmew.OrbitalEngineer.svg /app/share/icons/hicolor/scalable/apps/com.qmew.OrbitalEngineer.svg
    sources:
      - type: dir
        path: dist
        dest: dist
      - type: dir
        path: data
        dest: data
